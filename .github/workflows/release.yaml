name: Publish Release

on:
    push:
        tags:
            - "v*"

permissions:
    contents: write

jobs:
    github-release:
        runs-on: ubuntu-latest
        steps:
            - name: Create GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG_NAME: ${{ github.ref_name }}
              run: |
                  gh release create "$TAG_NAME" \
                    --repo "$GITHUB_REPOSITORY" \
                    --verify-tag \
                    --generate-notes \
                    --title "$TAG_NAME"
